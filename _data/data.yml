career-profile:
  title: Career Profile
  summary: |
    Staff DevOps/SRE Engineer with 12+ years of experience designing and operating cloud-native
    infrastructure at scale. Recognized as Kubestronaut — one of a select group globally to have
    passed all five CNCF Kubernetes certifications. Holds 19+ industry certifications spanning
    Kubernetes security, GitOps, service mesh, observability, and platform engineering.
    Specializes in Kubernetes, CI/CD pipelines, AWS, and site reliability engineering across
    cloud and on-premise environments.

experiences:
  title: Experiences
  info:
  - role: Staff DevOps Engineer
    time: May 2025 – Present
    company: Poshmark Inc.
    details: |
      - Leading infrastructure reliability, cloud architecture, and platform engineering initiatives.
      - Driving improvements to software delivery pipelines, application availability, and system automation.
      - Key Technologies: AWS, Kubernetes, Docker, Terraform, Jenkins, Ansible, ArgoCD, Datadog, Prometheus, ELK Stack, Python

  - role: Senior Site Reliability Engineer (Contract)
    time: Feb 2025 – May 2025
    company: Poshmark Inc.
    details: |
      - Served as Senior SRE driving improvements to software delivery pipelines and application availability.
      - Key Technologies: AWS, Kubernetes, Docker, Terraform, Python

  - role: Lead Software Engineer - DevOps & Site Reliability
    time: Oct 2021 – Dec 2024
    company: Poshmark Inc.
    details: |
      - Improved system reliability with automated failover solutions, reducing downtime by 20%.
      - Built and managed CI/CD pipelines with Jenkins, ArgoCD, and Ansible, enhancing deployment frequency by 15%.
      - Spearheaded Kubernetes (EKS) migration to improve scalability and deployment workflows by 25%.
      - Implemented Terraform for infrastructure codification, reducing manual errors by 30%.
      - Utilized Datadog, Prometheus, and Grafana for proactive monitoring, improving incident response times.
      - Key Technologies: AWS, Kubernetes, Docker, Terraform, Jenkins, Ansible, ArgoCD, Datadog, Prometheus, ELK Stack, Teleport, Python

  - role: Middleware & DevOps Engineer (Specialist Officer)
    time: Sep 2019 – Sep 2021
    company: Indian Bank
    details: |
      - Architected IT infrastructure solutions for mission-critical applications, achieving 99.9% uptime.
      - Introduced DevOps practices with Ansible and Jenkins, reducing deployment time by 40%.
      - Enhanced application performance through resource optimization and proactive monitoring with Prometheus.
      - Key Technologies: Kubernetes, Jenkins, Ansible, Scripting, Monitoring

  - role: DevOps Engineer
    time: Sep 2015 – May 2019
    company: DXC Technology (Kaiser Permanente Project)
    details: |
      - Led an offshore DevOps team for Kaiser Permanente, implementing IaC solutions to ensure consistent infrastructure environments.
      - Integrated DevOps practices to streamline development workflows and improve release cycles using Git and Jenkins.
      - Key Technologies: Linux, Jenkins, Nexus, Terraform, Ansible, Splunk, Python, Bash

  - role: Software Engineer
    time: Jan 2013 – Aug 2015
    company: Birlasoft India Ltd. (GE Capital Project)
    details: |
      - Optimized middleware systems, ensuring reliable application performance across Linux environments.
      - Performed Middleware administration tasks for web and application servers, reducing operational downtime by 15%.
      - Key Technologies: Linux, WebSphere, WebLogic, Apache, Python, Shell Scripting

